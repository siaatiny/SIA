<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미공포 분철 목록</title>
<style>
:root{
  --bg:#f4f4f6; --card:#fff; --text:#1c1c22; --sub:#777; --line:#e2e2e8;
  --accent:#2d2d35; --on:#ff5c8a; --on-text:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16161a; --card:#212127; --text:#f1f1f4; --sub:#9a9aa5; --line:#34343c; --accent:#e8e8ee; --on:#ff6b96; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
header{padding:20px 16px 8px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--sub);font-size:13px}
main{max-width:900px;margin:0 auto;padding:8px 16px 80px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:14px;cursor:pointer}
.tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.box h2{margin:0 0 10px;font-size:15px}
input[type=text],input[type=number],input[type=date],input[type=search]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:8px}
label.f{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
button{font-family:inherit}
.btn{padding:10px 14px;border:none;border-radius:8px;background:var(--accent);color:var(--bg);font-size:14px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{max-width:100%;max-height:240px;border-radius:8px;margin:6px 0;display:none}
.entry-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.entry-title{font-weight:700;font-size:16px;word-break:keep-all}
.entry-date{color:var(--sub);font-size:12px}
.entry img{width:100%;border-radius:10px;margin:10px 0;display:block;cursor:zoom-in}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-size:14px;cursor:pointer;user-select:none}
.chip b{margin-left:4px}
.chip.on{background:var(--on);border-color:var(--on);color:var(--on-text);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:130px}
td.o{color:var(--on);font-weight:800}
td.x{color:var(--sub)}
tfoot td{font-weight:700;color:var(--sub)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stat{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.note{font-size:12px;color:var(--sub);margin-top:6px}
#status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:10}
footer{text-align:center;margin-top:30px}
.admin-only{display:none}
body.admin .admin-only{display:block}
body.admin .admin-only.inline{display:flex}
/* 세트 특전 */
.bonus{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
.bonus-title{font-weight:700;font-size:14px;margin-bottom:8px}
.counter{display:flex;align-items:center;gap:12px}
.counter button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.counter .num{font-size:18px;font-weight:800;min-width:70px;text-align:center}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--on);width:0}
.editbox{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.editbox .chk{display:flex;gap:6px;align-items:center;font-size:14px;margin:6px 0 10px}
</style>
</head>
<body>
<header>
  <h1>🏴‍☠️ 미공포 분철 목록</h1>
  <p>탑승한 멤버를 눌러 O / X 로 표시하세요. 내 선택은 이 브라우저에 자동 저장돼요.</p>
</header>
<main>
  <div class="tabs">
    <button class="tab active" data-tab="list">📋 미공포 목록</button>
    <button class="tab" data-tab="sum">✅ 내 체크표</button>
  </div>

  <section id="view-list">
    <!-- 관리자 전용: 미공포 등록 -->
    <div class="box admin-only" id="addBox">
      <h2>새 미공포 등록 (관리자)</h2>
      <input type="text" id="newTitle" placeholder="예) 헬로라이브(볼찌빵VER.) 26.11.08 팬싸인회 미공개 포카">
      <input type="date" id="newDate">
      <input type="file" id="newImg" accept="image/*">
      <img id="newPreview" class="preview" alt="">
      <div class="row" style="margin-top:8px">
        <button class="btn" id="addBtn">등록하기</button>
      </div>
      <p class="note">세트 특전은 등록 후 각 카드의 "수정" 버튼에서 추가할 수 있어요.</p>
    </div>

    <input type="search" id="search" placeholder="🔍 미공포 검색">
    <div id="entries"></div>
  </section>

  <section id="view-sum" style="display:none">
    <div class="box">
      <h2>내 탑승 현황</h2>
      <div class="stats" id="stats"></div>
      <div class="tablewrap" id="matrix"></div>
    </div>
  </section>

  <footer>
    <button class="btn ghost small" id="loginBtn">🔑 관리자 로그인</button>
  </footer>
</main>

<div id="lightbox"><img alt=""></div>
<div id="status"></div>

<script>
const MEMBERS = ["홍중","성화","윤호","여상","산","민기","우영","종호"];

/* ===== 저장소 정보 (자동 인식. 안 맞으면 아래에 직접 입력) ===== */
const OVERRIDE_OWNER = "";   // 예: "myid"
const OVERRIDE_REPO  = "";   // 예: "photocard"
const host = location.hostname;
const seg = location.pathname.split("/")[1];
const OWNER = OVERRIDE_OWNER || (host.endsWith("github.io") ? host.split(".")[0] : "");
const REPO  = OVERRIDE_REPO  || ((seg && seg !== "index.html") ? seg : host);

const TOKEN_KEY = "pc-admin-token";
const MINE_KEY  = "pc-mine-v2";
const BONUS_KEY = "pc-bonus-v1";

let entries = [];
let editingId = null;
let token = localStorage.getItem(TOKEN_KEY) || "";
let mine = {};   try { mine  = JSON.parse(localStorage.getItem(MINE_KEY))  || {}; } catch(e){}
let mineB = {};  try { mineB = JSON.parse(localStorage.getItem(BONUS_KEY)) || {}; } catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveMine(){ localStorage.setItem(MINE_KEY, JSON.stringify(mine)); localStorage.setItem(BONUS_KEY, JSON.stringify(mineB)); }
function status(msg, ms){
  const s = $("#status"); s.textContent = msg; s.style.display = msg ? "block" : "none";
  if(ms) setTimeout(()=> s.style.display = "none", ms);
}

/* ===== GitHub API ===== */
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
function ghHeaders(){ return { "Authorization":"Bearer "+token, "Accept":"application/vnd.github+json" }; }
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));

async function getFile(path){
  const r = await fetch(API+path+"?t="+Date.now(), { headers: ghHeaders() });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error("GitHub 오류 "+r.status);
  return r.json();
}
async function putFile(path, contentB64, message, sha){
  const body = { message, content: contentB64 };
  if(sha) body.sha = sha;
  const r = await fetch(API+path, { method:"PUT", headers: ghHeaders(), body: JSON.stringify(body) });
  if(!r.ok) throw new Error("저장 실패 "+r.status);
  return r.json();
}
async function deleteFile(path){
  try{
    const f = await getFile(path);
    if(!f) return;
    await fetch(API+path, { method:"DELETE", headers: ghHeaders(), body: JSON.stringify({ message:"delete image", sha:f.sha }) });
  }catch(e){}
}
async function saveData(){
  const clean = entries.map(({id,title,date,img,bonus}) => ({id,title,date,img,bonus:bonus||null}));
  const cur = await getFile("data.json");
  await putFile("data.json", b64enc(JSON.stringify({entries:clean}, null, 1)), "update data", cur && cur.sha);
}

/* ===== 데이터 불러오기 ===== */
async function loadData(){
  try{
    if(token && OWNER){
      const f = await getFile("data.json");
      entries = f ? (JSON.parse(b64dec(f.content)).entries || []) : [];
    } else {
      const r = await fetch("data.json?t="+Date.now());
      entries = r.ok ? ((await r.json()).entries || []) : [];
    }
  }catch(e){ entries = []; }
  render();
}

/* ===== 이미지 압축 ===== */
function compress(file, max=1000){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const r = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg", .85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ===== 관리자 로그인 ===== */
function setAdmin(on){
  document.body.classList.toggle("admin", on);
  $("#loginBtn").textContent = on ? "🔓 관리자 로그아웃" : "🔑 관리자 로그인";
  if(!on) editingId = null;
  render();
}
$("#loginBtn").addEventListener("click", async ()=>{
  if(token){
    token = ""; localStorage.removeItem(TOKEN_KEY); setAdmin(false); loadData(); return;
  }
  if(!OWNER){ alert("GitHub Pages 주소에서 접속해야 로그인할 수 있어요."); return; }
  const t = prompt("GitHub 토큰(Personal Access Token)을 입력하세요");
  if(!t) return;
  try{
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, { headers:{ "Authorization":"Bearer "+t.trim(), "Accept":"application/vnd.github+json" } });
    const j = await r.json();
    if(!r.ok || !j.permissions || !j.permissions.push) throw 0;
    token = t.trim(); localStorage.setItem(TOKEN_KEY, token);
    setAdmin(true); loadData();
  }catch(e){ alert("토큰이 올바르지 않거나 이 저장소에 쓰기 권한이 없어요."); }
});

/* ===== 미공포 등록 (관리자) ===== */
let pendingImg = "";
$("#newImg").addEventListener("change", async e=>{
  const f = e.target.files[0];
  if(!f) return;
  pendingImg = await compress(f);
  const p = $("#newPreview"); p.src = pendingImg; p.style.display = "block";
});
$("#addBtn").addEventListener("click", async ()=>{
  const title = $("#newTitle").value.trim();
  if(!title){ alert("미공포 이름을 입력해 주세요."); return; }
  const btn = $("#addBtn"); btn.disabled = true; status("저장 중...");
  try{
    const id = Date.now().toString(36);
    let img = "";
    if(pendingImg){
      img = "images/"+id+".jpg";
      await putFile(img, pendingImg.split(",")[1], "add image");
    }
    entries.unshift({ id, title, date: $("#newDate").value, img, bonus:null, _p: pendingImg });
    await saveData();
    $("#newTitle").value = ""; $("#newDate").value = ""; $("#newImg").value = "";
    pendingImg = ""; $("#newPreview").style.display = "none";
    render(); status("✅ 저장됐어요! (사이트 반영까지 1~2분 걸려요)", 4000);
  }catch(e){ status("❌ "+e.message, 4000); }
  btn.disabled = false;
});

/* ===== 화면 ===== */
function bonusHTML(e){
  const b = e.bonus;
  if(!b) return "";
  const per = b.per || 3, pick = b.pick || 0, types = b.types || [], goal = b.goal || 0;
  const bm = mineB[e.id] || { sets:0, types:[] };
  const sets = bm.sets || 0;
  let info = `앨범 <b>${sets*per}장</b> 구매`;
  if(pick) info += ` · 인화사진 <b>${sets*pick}장</b> 받음`;
  const lines = [info];
  if(types.length && pick) lines.push(`전종 모으려면 최소 ${Math.ceil(types.length/pick)}세트 (앨범 ${Math.ceil(types.length/pick)*per}장), 랜덤이라 더 필요할 수 있어요`);
  const pct = goal ? Math.min(100, Math.round(sets/goal*100)) : 0;
  return `
  <div class="bonus">
    <div class="bonus-title">🎁 세트 특전 · ${esc(b.name || "세트 특전")} <span class="note">(세트 = 앨범 ${per}장${pick?`, ${pick}종 증정`:""})</span></div>
    <div class="counter">
      <button data-act="bminus">−</button>
      <span class="num">${sets}세트</span>
      <button data-act="bplus">+</button>
    </div>
    ${goal ? `<div class="bar"><div style="width:${pct}%"></div></div>
    <div class="note">목표 ${goal}세트 (앨범 ${goal*per}장) 중 ${sets}세트 · ${pct}%</div>` : ""}
    <div class="note">${lines.join("<br>")}</div>
    ${types.length ? `<div class="chips">${types.map((t,i)=>{ const on=(bm.types||[]).includes(i);
      return `<span class="chip ${on?'on':''}" data-act="btype" data-i="${i}">${esc(t)}<b>${on?'O':'X'}</b></span>`; }).join("")}</div>` : ""}
  </div>`;
}

function editHTML(e){
  const b = e.bonus || {};
  return `
  <div class="editbox">
    <label class="f">미공포 이름</label>
    <input type="text" class="ed-title" value="${esc(e.title)}">
    <label class="f">날짜</label>
    <input type="date" class="ed-date" value="${esc(e.date||"")}">
    <label class="chk"><input type="checkbox" class="ed-on" ${e.bonus?"checked":""}> 세트 특전 사용</label>
    <div class="ed-fields" style="display:${e.bonus?"block":"none"}">
      <label class="f">특전 이름</label>
      <input type="text" class="ed-bname" placeholder="예) 유닛 인화사진" value="${esc(b.name||"")}">
      <div class="grid2">
        <div><label class="f">세트당 앨범 수</label><input type="number" min="1" class="ed-per" value="${b.per||3}"></div>
        <div><label class="f">세트당 증정 수</label><input type="number" min="0" class="ed-pick" value="${b.pick||2}"></div>
      </div>
      <label class="f">특전 종류 이름 (쉼표로 구분, 비워도 됨)</label>
      <input type="text" class="ed-types" placeholder="예) 유닛A, 유닛B, 유닛C, 유닛D" value="${esc((b.types||[]).join(", "))}">
      <label class="f">목표 세트 수 (예: 4세트 = 앨범 12장)</label>
      <input type="number" min="0" class="ed-goal" value="${b.goal||0}">
    </div>
    <div class="row">
      <button class="btn small" data-act="saveedit">저장</button>
      <button class="btn ghost small" data-act="canceledit">취소</button>
    </div>
  </div>`;
}

function render(){
  const q = $("#search").value.trim().toLowerCase();
  const list = entries.filter(e => e.title.toLowerCase().includes(q));
  const box = $("#entries");
  if(!list.length){
    box.innerHTML = `<div class="empty">${entries.length ? "검색 결과가 없어요." : "아직 등록된 미공포가 없어요."}</div>`;
  } else {
    box.innerHTML = list.map(e => {
      const my = mine[e.id] || [];
      const src = e._p || e.img;
      const editing = token && editingId === e.id;
      return `
      <div class="box entry" data-id="${e.id}">
        <div class="entry-head">
          <div>
            <div class="entry-title">${esc(e.title)}</div>
            ${e.date ? `<div class="entry-date">${esc(e.date)}</div>` : ""}
          </div>
          <div class="row admin-only inline">
            <button class="btn ghost small" data-act="edit">수정</button>
            <button class="btn ghost small" data-act="del">삭제</button>
          </div>
        </div>
        ${editing ? editHTML(e) : ""}
        ${src ? `<img src="${src}" alt="${esc(e.title)}" data-act="zoom">` : ""}
        <div class="chips">
          ${MEMBERS.map(m => { const on = my.includes(m);
            return `<span class="chip ${on?'on':''}" data-act="toggle" data-m="${m}">${m}<b>${on?'O':'X'}</b></span>`; }).join("")}
        </div>
        ${bonusHTML(e)}
      </div>`;
    }).join("");
  }
  renderSummary();
}

$("#entries").addEventListener("change", e=>{
  if(e.target.classList.contains("ed-on")){
    e.target.closest(".editbox").querySelector(".ed-fields").style.display = e.target.checked ? "block" : "none";
  }
});

$("#entries").addEventListener("click", async e=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const card = t.closest(".entry");
  const item = entries.find(x => x.id === card.dataset.id);
  const act = t.dataset.act;

  if(act === "toggle"){
    const m = t.dataset.m;
    const my = mine[item.id] || [];
    mine[item.id] = my.includes(m) ? my.filter(x=>x!==m) : [...my, m];
    saveMine(); render();
  } else if(act === "bplus" || act === "bminus"){
    const bm = mineB[item.id] || { sets:0, types:[] };
    bm.sets = Math.max(0, (bm.sets||0) + (act==="bplus" ? 1 : -1));
    mineB[item.id] = bm; saveMine(); render();
  } else if(act === "btype"){
    const bm = mineB[item.id] || { sets:0, types:[] };
    const i = +t.dataset.i;
    bm.types = (bm.types||[]).includes(i) ? bm.types.filter(x=>x!==i) : [...(bm.types||[]), i];
    mineB[item.id] = bm; saveMine(); render();
  } else if(act === "zoom"){
    $("#lightbox img").src = item._p || item.img; $("#lightbox").style.display = "flex";
  } else if(token && act === "edit"){
    editingId = (editingId === item.id) ? null : item.id; render();
  } else if(token && act === "canceledit"){
    editingId = null; render();
  } else if(token && act === "saveedit"){
    const eb = card.querySelector(".editbox");
    const title = eb.querySelector(".ed-title").value.trim();
    if(!title){ alert("미공포 이름을 입력해 주세요."); return; }
    item.title = title;
    item.date = eb.querySelector(".ed-date").value;
    if(eb.querySelector(".ed-on").checked){
      item.bonus = {
        name: eb.querySelector(".ed-bname").value.trim(),
        per:  Math.max(1, parseInt(eb.querySelector(".ed-per").value)  || 3),
        pick: Math.max(0, parseInt(eb.querySelector(".ed-pick").value) || 0),
        types: eb.querySelector(".ed-types").value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean),
        goal: Math.max(0, parseInt(eb.querySelector(".ed-goal").value) || 0)
      };
    } else item.bonus = null;
    editingId = null; render(); status("저장 중...");
    try{ await saveData(); status("✅ 저장됐어요!", 3000); }catch(err){ status("❌ "+err.message, 4000); }
  } else if(token && act === "del"){
    if(!confirm(`"${item.title}" 을(를) 삭제할까요?`)) return;
    entries = entries.filter(x => x.id !== item.id); render(); status("삭제 중...");
    try{
      await saveData();
      if(item.img) await deleteFile(item.img);
      status("✅ 삭제됐어요!", 3000);
    }catch(err){ status("❌ "+err.message, 4000); }
  }
});
$("#lightbox").addEventListener("click", ()=> $("#lightbox").style.display = "none");
$("#search").addEventListener("input", render);

function renderSummary(){
  if(!entries.length){
    $("#stats").innerHTML = "";
    $("#matrix").innerHTML = `<div class="empty">등록된 미공포가 없어요.</div>`;
    return;
  }
  const totals = MEMBERS.map(m => entries.filter(e => (mine[e.id]||[]).includes(m)).length);
  const albums = entries.reduce((s,e)=> e.bonus ? s + ((mineB[e.id]||{}).sets||0)*(e.bonus.per||3) : s, 0);
  $("#stats").innerHTML = `<span class="stat">미공포 ${entries.length}종</span>` +
    (albums ? `<span class="stat">세트 특전 앨범 ${albums}장</span>` : "") +
    MEMBERS.map((m,i)=>`<span class="stat">${m} O ${totals[i]}</span>`).join("");
  $("#matrix").innerHTML = `
    <table>
      <thead><tr><th>미공포</th>${MEMBERS.map(m=>`<th>${m}</th>`).join("")}</tr></thead>
      <tbody>
        ${entries.map(e=>`<tr><td>${esc(e.title)}</td>${MEMBERS.map(m=>(mine[e.id]||[]).includes(m)?`<td class="o">O</td>`:`<td class="x">X</td>`).join("")}</tr>`).join("")}
      </tbody>
      <tfoot><tr><td>O 합계</td>${totals.map(n=>`<td>${n}</td>`).join("")}</tr></tfoot>
    </table>`;
}

document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===b));
    $("#view-list").style.display = b.dataset.tab==="list" ? "" : "none";
    $("#view-sum").style.display = b.dataset.tab==="sum" ? "" : "none";
  });
});

setAdmin(!!token);
loadData();
</script>
